<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Page Not Found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0e1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 { font-size: 5rem; color: #ff9900; font-weight: 900; }
    p  { font-size: 1.2rem; color: #64748b; margin: 16px 0 32px; }
    a  {
      background: #ff9900;
      color: #000;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #ff6600; }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Oops! This page doesn't exist on S3 + CloudFront 😅</p>
  <a href="/">← Back to Home</a>
</body>
</html>
